spring:
  application:
    name: mavora
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mavora}
    username: ${DATABASE_USERNAME:mavora}
    password: ${DATABASE_PASSWORD:mavora}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 32MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

mavora:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    session-ttl: ${SESSION_TTL:14d}
    cookie-name: mavora_session
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: Lax
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
    model-cmo: ${LLM_MODEL_CMO:deepseek-v4-flash}
    monthly-budget-cents: ${LLM_MONTHLY_BUDGET_CENTS:2000}
    timeout: 60s
  fal:
    provider: ${FAL_PROVIDER:fal}
    api-key: ${FAL_KEY:}
    image-model: ${FAL_IMAGE_MODEL:fal-ai/flux/schnell}
    video-model: ${FAL_VIDEO_MODEL:fal-ai/wan-25-preview/text-to-video}
    timeout: 180s
  jobs:
    inline: ${MAVORA_JOBS_INLINE:false}
    poll-interval-ms: 2000
  website:
    timeout: 8s
    max-bytes: 524288
  public:
    app-url: ${PUBLIC_APP_URL:http://localhost:5173}
    api-url: ${PUBLIC_API_URL:http://localhost:8080}
  crypto:
    secret: ${MAVORA_CRYPTO_SECRET:mavora-dev-only-change-me}
  instagram:
    provider: ${INSTAGRAM_PROVIDER:fake}
    graph-version: ${INSTAGRAM_GRAPH_VERSION:v21.0}
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:8080/api/v1/integrations/instagram/callback}
    publish-interval-ms: 15000
  media:
    directory: ${MAVORA_MEDIA_DIR:data/media}
    max-bytes: 8388608

logging:
  pattern:
    console: "%d{ISO8601} [%X{requestId:-}] %-5level %logger{36} - %msg%n"
