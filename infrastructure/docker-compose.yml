services:
  postgres:
    image: postgres:16-alpine
    container_name: mavora-postgres
    environment:
      POSTGRES_DB: mavora
      POSTGRES_USER: mavora
      POSTGRES_PASSWORD: mavora
    ports:
      - "5432:5432"
    volumes:
      - mavora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mavora -d mavora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mavora_pg:
